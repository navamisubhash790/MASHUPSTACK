<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
  <h1>Positive or Negative number</h1>
<p id="pos"></p>
<p id="neg"></p>
<script>
    let number = -12;
    let posorneg = (number >= 0) ? "positive number" : "negative number";
    console.log("negative or positive number: " + posorneg);
    document.getElementById("pos").innerHTML = ("number: "  + number);
    document.getElementById("neg").innerHTML = ("positive number or negative number: " + posorneg);
</script>
    
</body>
</html>
