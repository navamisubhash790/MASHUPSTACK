<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Sum of even numbers</h1>
    <script type = "text/javascript">
    let sum = 0
    for(let i = 1;i <= 10; i++){
        if(i % 2 == 0){
        sum = sum + i;
        }
    }
        document.write("sum of even numbers = " + sum)
        </script>
    
</body>
