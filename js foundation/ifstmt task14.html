<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>SIMPLE CALCULATOR</h1>
    <p id="cal"></p>
    <p id="cal1"></p>
    <script>
        let num1 = 20;
        let num2 = 5;
        let operator = "*";
        let result;
        if(operator == "*"){
         result = num1 * num2}
        else if(operator == "+"){
           result = num1 + num2}
        else if(operator == "-"){
           result = num1 - num2}
        else if(operator == "/" && num2 !== 0){
           result = num1 / num2}
        else if(operator == "/" && num2 == 0){
           result =  "cannot divide by zero";}
        else {
            result =  "invalid operator"}
        console.log("operator: " + operator);
        console.log("result: " + result);
        document.getElementById("cal").innerHTML = ("operator: " + operator);
        document.getElementById("cal1").innerHTML = ("Result: " + result);
    </script>
</body>
</html>
