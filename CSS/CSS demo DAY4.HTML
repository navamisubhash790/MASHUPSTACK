!DOCTYPE html>
<html>
<head>
<style>
div.one {
      border:5px solid #4FFFA1;
    }
div.two {
      border:5px solid #CCCCCC;
    }
    div.first {
      border:5px solid #4FFFA1;
      width:200px;
    }
    div.second {
      position: relative;
      left: 100px;
      width:200px;
      border:5px solid #CCCCCC;
    }
    div.third {
      position: relative;
      left: 100px;
      width:200px;
        border:5px solid #ee3e64}
</style>
</head>
<body>
  <div class="one">Static Position Example - 1</div>
  <div class="two">Static Position Example - 2 </div>
   <div class="first">First Div</div>
  <div class="second">Second Div
  <div class="third">Third Div</div></div>
</body>
</html>
<!DOCTYPE html>
<html>
<head>
<style>
    div.first {
    border:5px solid #4FFFA1;
      width:200px;
    }
    div.second {
      width:200px;
      border:5px solid #CCCCCC;
    }
    div.third {
      position: fixed;
      top: 0px;
      right:0px;
      width:200px;
      border:5px solid #ee3e64;
    }
</style>
</head>
<body>
  <div class="first">
    One<br>
    Two<br>
    Three<br>
    Four<br>
    Five<br>
  </div>
  <div class="second">
    Six<br>
    Seven<br>
    Eight<br>
    Nine<br>
    Ten<br>
  </div>
  <div class="third">Fix Here</div>
</body>
</html>
<!DOCTYPE html>
<html>
<head>
<style>
    div.first {
      border:5px solid #4FFFA1;
      width:200px;
    }
    div.second {
      width:200px;
      border:5px solid #CCCCCC;
    }
    div.third {
      position: absolute;
      top: 10px;
      right:10px;
      width:200px;
      border:5px solid #ee3e64;
    }
</style>
</head>
<body>
  <div class="first">First Div</div>
  <div class="second">Second Div
  <div class="third">Third Div</div></div>
</body>
</html>
