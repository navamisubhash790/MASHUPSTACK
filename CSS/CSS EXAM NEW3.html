
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family:sans-serif;
      background: #f3f3f6;
      display: flex;
      

      
    }

   
    .banner {
        width:60%;
      min-height:100vh;
      background: linear-gradient(180deg, #c3c5cf 0%, #d4cdc7 55%, #d5c1af 100%);
    
    }

    form {
      width: 60%;
      margin-left: 8%;
      padding: 8%;
    }

    h2 {
      color: #d4573a;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      
      margin-bottom: 8px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 50px;
      padding: 0 12px;
      font-size: 16px;
      font-family: inherit;
     
      border: 1px solid grey;
      border-radius: 2px;
      margin-bottom: 22px;
      
    }

    

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .remember label {
      font-size: 16px;
      font-weight: 400;
      margin: 0;
    }

    button {
      width: 100%;
      height: 45px;
      background: #d9603f;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
    }

    button:hover { background: orange; }


    @media (max-width: 600px) {
      .banner { display: none; }

      form {
        width: 100%;
        margin: 0;
        padding: 40px 20px;
      }

      h2 { font-size: 34px; margin-bottom: 30px; }

      label { font-size: 18px; margin-bottom: 10px; }

      input[type="email"],
      input[type="password"] {
        height: 70px;
        font-size: 18px;
        margin-bottom: 28px;
      }

      .remember label { font-size: 16px; }

      button { height: 60px; font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="banner"></div>

  <form action="#" method="post">
    <h2>Login Form</h2>

    <label for="email">Email :</label>
    <input type="email" id="email" required>

    <label for="password">Password :</label>
    <input type="password" id="password" required>

    <div class="remember">
      <input type="checkbox" id="remember">
      <label for="remember">Remember Me</label>
    </div>

    <button type="submit">Login</button>
  </form>

</body>
</html>
