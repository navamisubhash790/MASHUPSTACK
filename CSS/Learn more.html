<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid black;
            margin-top: 100px;
            margin-bottom: 100px;
            margin-right: 150px;
            margin-left: 150px;
            background-color: yellow;}
            p.para{
                background-color: pink;

            }
            p.ex{
                margin: 50px 100px 150px 200px;


            }
            

        
    </style>
</head>
<body>
    <p class="para">css cascading style sheet</p>
    <p class="ex">css cascading style sheet is easy to learn</p>
   <div>This div element has a top margin of 100px, a right margin of 150px, a bottom margin 
of 100px, and a left margin of 80px.</div> 
</body>
</html>
